<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Inteligente Lotofácil</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        h1 { color: #8e44ad; }
        .game-output { margin-top: 20px; border: 2px solid #ccc; padding: 15px; border-radius: 5px; min-height: 50px; text-align: center; }
        .number { display: inline-block; background-color: #8e44ad; color: white; border-radius: 50%; width: 40px; height: 40px; line-height: 40px; text-align: center; font-size: 18px; font-weight: bold; margin: 3px; }
        button { padding: 10px 20px; background-color: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        button:hover { background-color: #27ad60; }
        #fileInput { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 Gerador Inteligente Lotofácil</h1>
        <p>1. Carregue o arquivo de resultados (.csv).</p>
        <input type="file" id="fileInput" accept=".csv" />
        
        <p>2. Clique para gerar um jogo estatístico.</p>
        <button onclick="generateGame()">Gerar Jogo (15 Números)</button>
        
        <div class="game-output" id="gameOutput">
            Aguardando a geração do jogo...
        </div>

        <p id="statsMessage" style="margin-top: 15px; color: #34495e; font-size: 14px;"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
