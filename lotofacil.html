<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Lotofácil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col min-h-screen">
    <header class="bg-white shadow-md">
        <nav class="max-w-4xl mx-auto p-4 flex justify-between items-center">
            <div class="text-2xl font-extrabold text-gray-800">
                <a href="index.html" class="text-violet-600">Loterias.io</a>
            </div>
            <div class="space-x-4">
                <a href="index.html" class="p-2 rounded hover:bg-gray-100 text-gray-700 transition duration-150">Início</a>
                <a href="lotofacil.html" class="p-2 rounded bg-gray-100 text-violet-600 font-semibold">Lotofácil</a>
                <a href="megasena.html" class="p-2 rounded hover:bg-gray-100 text-gray-400 cursor-not-allowed">Mega Sena</a>
                <a href="diadesorte.html" class="p-2 rounded hover:bg-gray-100 text-gray-400 cursor-not-allowed">Dia de Sorte</a>
            </div>
        </nav>
    </header>

    <main class="flex-grow max-w-4xl mx-auto p-6 w-full">
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h1 class="text-3xl font-bold text-violet-700 mb-6">Gerador Inteligente Lotofácil</h1>
            <p class="text-gray-600 mb-6">1. Carregue o arquivo de resultados (.csv).</p>
            <input type="file" id="fileInput" accept=".csv" class="mb-4 p-2 border rounded w-full" />
            
            <p class="text-gray-600 mb-6">2. Clique para gerar um jogo estatístico.</p>
            <button onclick="generateGame()" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow-md transition duration-200">Gerar Jogo (15 Números)</button>
            
            <div class="game-output-lf" id="gameOutput">
                Aguardando a geração do jogo...
            </div>

            <p id="statsMessage" class="text-sm text-green-600 mt-4 font-medium"></p>
        </div>
    </main>

    <footer class="bg-gray-800 text-white text-center p-4 mt-auto">
        © 2025 Loterias.io | Análise Estatística
    </footer>

    <script src="lotofacil.js"></script>
</body>
</html>
